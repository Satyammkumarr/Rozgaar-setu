<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Detail - RozgaarSetu</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;outline:none}</style>
</head>
<body class="bg-[#f6f7ff]">
<div class="p-4 bg-white flex items-center gap-3"><a href="index.html" class="bg-gray-100 px-3 py-1 rounded-full text-sm">← Back</a><h1 class="font-bold text-blue-700 text-sm">RozgaarSetu - REAL</h1></div>

<div class="max-w-2xl mx-auto p-4">
<div class="bg-white rounded-2xl p-6 shadow">
<div class="flex gap-4"><div id="jobIcon" class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-xl">⚡</div><div><h2 id="jobTitle" class="font-bold"></h2><p id="jobSalary" class="text-blue-600 text-sm font-bold"></p><span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full">✓ Verified</span></div></div>
<p id="jobDesc" class="text-xs text-gray-600 mt-4"></p>
<button id="openFormBtn" class="w-full bg-blue-700 text-white py-3 rounded-xl mt-6 font-bold text-sm">Apply Now - Free me</button>
</div>
</div>

<div id="applyModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white w-full max-w-md rounded-2xl p-6"><div class="flex justify-between mb-4"><h2 class="font-bold">Apply for <span id="modalJobName" class="text-blue-700"></span></h2><button id="closeModal" class="bg-gray-100 w-8 h-8 rounded-full">×</button></div><form id="jobApplyForm" class="space-y-3"><input id="fullName" class="input" placeholder="Aapka Naam" required><input id="mobile" class="input" placeholder="Mobile Number" required><input id="city" class="input" value="Lucknow" required><button class="w-full bg-blue-700 text-white py-3 rounded-xl font-bold">Submit Application</button></form></div></div>

<div id="successBox" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white w-full max-w-md rounded-2xl p-6 text-center"><div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-2xl mx-auto">✓</div><h2 class="font-bold mt-3">Application Successful!</h2><p id="successText" class="text-xs text-gray-500 mt-1"></p><div class="text-left mt-4"><p class="font-bold text-xs">Aap in jobs ke liye bhi apply kar sakte ho:</p><a href="job-detail.html?job=plumber" class="block border rounded-xl p-2 mt-2 text-xs">🔧 Plumber - Lucknow</a><a href="job-detail.html?job=teacher" class="block border rounded-xl p-2 mt-2 text-xs">📚 Teacher - Gomti Nagar</a></div><button id="closeSuccess" class="w-full bg-gray-100 py-2 rounded-xl mt-4 font-bold text-sm">Band Kare</button></div></div>

<script>
const jobs={electrician:{title:'Electrician',salary:'₹18K - ₹25K / month',icon:'⚡',desc:'Anubhavi Electrician chahiye Hazratganj Lucknow me.'},plumber:{title:'Plumber',salary:'₹16K - ₹22K',icon:'🔧',desc:'Plumber ki zarurat Lucknow me.'},driver:{title:'Driver',salary:'₹15K - ₹20K',icon:'🚚',desc:'Driver ki bharti Full Time.'},teacher:{title:'Teacher',salary:'₹25K - ₹35K',icon:'📚',desc:'Teacher chahiye Gomti Nagar.'},developer:{title:'Developer',salary:'₹40K - ₹60K',icon:'💻',desc:'Web Developer vacancy.'},designer:{title:'Designer',salary:'₹30K - ₹50K',icon:'🎨',desc:'Graphic Designer chahiye.'}}
const key=(new URLSearchParams(location.search).get('job')||'electrician').toLowerCase();const job=jobs[key]||jobs.electrician;
document.getElementById('jobTitle').innerText=job.title;document.getElementById('jobSalary').innerText=job.salary;document.getElementById('jobIcon').innerText=job.icon;document.getElementById('jobDesc').innerText=job.desc;document.getElementById('modalJobName').innerText=job.title;
const modal=document.getElementById('applyModal');const successBox=document.getElementById('successBox');
document.getElementById('openFormBtn').onclick=()=>modal.classList.remove('hidden');document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('closeSuccess').onclick=()=>successBox.classList.add('hidden');
document.getElementById('jobApplyForm').onsubmit=(e)=>{e.preventDefault();let data={job:job.title,name:document.getElementById('fullName').value,mobile:document.getElementById('mobile').value,time:new Date().toLocaleString()};let all=JSON.parse(localStorage.getItem('rozgaar_applications')||'[]');all.push(data);localStorage.setItem('rozgaar_applications',JSON.stringify(all));modal.classList.add('hidden');document.getElementById('successText').innerText=data.name+', aapne '+data.job+' ke liye apply kiya';successBox.classList.remove('hidden');e.target.reset();}
</script>
</body>
</html>
